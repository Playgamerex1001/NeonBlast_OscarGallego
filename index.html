<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Neon Blast</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app">
    <section id="screen-menu" class="screen screen--menu" aria-label="Menú principal">
      <h1 class="title">Neon Blast</h1>
      <p class="tagline">Estilo Peggle · Balde móvil en todas las dificultades</p>

      <fieldset class="difficulty-picker">
        <legend class="difficulty-picker__legend">Dificultad</legend>
        <label class="difficulty-picker__option">
          <input type="radio" name="difficulty" value="easy" checked />
          <span>Fácil <em class="difficulty-picker__detail">30 bolas</em></span>
        </label>
        <label class="difficulty-picker__option">
          <input type="radio" name="difficulty" value="normal" />
          <span>Normal <em class="difficulty-picker__detail">20 bolas</em></span>
        </label>
        <label class="difficulty-picker__option">
          <input type="radio" name="difficulty" value="hard" />
          <span>Difícil <em class="difficulty-picker__detail">10 bolas</em></span>
        </label>
      </fieldset>

      <div class="menu-actions">
        <button type="button" id="btn-start-level-1" class="btn btn--primary">
          Iniciar nivel 1
        </button>
        <button type="button" id="btn-settings" class="btn btn--ghost">
          Ajustes
        </button>
      </div>

      <div
        id="overlay-settings"
        class="menu-overlay is-hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
        aria-hidden="true"
      >
        <div class="menu-overlay__panel">
          <h2 id="settings-title" class="menu-overlay__title">Ajustes</h2>
          <p class="menu-overlay__hint">El audio se usará cuando esté implementado.</p>

          <div class="settings-sliders">
            <div class="settings-slider">
              <label class="settings-slider__label" for="slider-music">Musica</label>
              <input
                type="range"
                id="slider-music"
                class="settings-slider__input"
                min="0"
                max="100"
                value="80"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="80"
              />
              <span id="value-music" class="settings-slider__value" aria-live="polite">80</span>
            </div>
            <div class="settings-slider">
              <label class="settings-slider__label" for="slider-sfx">SFX</label>
              <input
                type="range"
                id="slider-sfx"
                class="settings-slider__input"
                min="0"
                max="100"
                value="80"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="80"
              />
              <span id="value-sfx" class="settings-slider__value" aria-live="polite">80</span>
            </div>
          </div>

          <button type="button" id="btn-settings-close" class="btn btn--primary">Volver</button>
        </div>
      </div>
    </section>

    <section
      id="screen-level"
      class="screen screen--level is-hidden"
      aria-label="Partida"
      aria-hidden="true"
    >
      <header class="level-hud" aria-live="polite">
        <span id="hud-score" class="level-hud__score">Puntos: 0</span>
        <span id="hud-balls" class="level-hud__balls">Bolas: —</span>
        <span id="hud-difficulty" class="level-hud__difficulty"></span>
      </header>
      <div class="stage-wrap">
        <canvas id="game-canvas" class="game-canvas" aria-hidden="false"></canvas>

        <div id="overlay-win" class="level-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-win-title" aria-hidden="true">
          <div class="level-overlay__panel">
            <h2 id="overlay-win-title" class="level-overlay__title level-overlay__title--win">Ganaste</h2>
            <p id="overlay-win-score" class="level-overlay__score">Puntuación: 0</p>
            <button type="button" id="btn-retry-win" class="btn btn--primary">Reintentar nivel</button>
          </div>
        </div>

        <div id="overlay-lose" class="level-overlay is-hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-lose-title" aria-hidden="true">
          <div class="level-overlay__panel">
            <h2 id="overlay-lose-title" class="level-overlay__title level-overlay__title--lose">Fallaste</h2>
            <p id="overlay-lose-score" class="level-overlay__score">Puntuación: 0</p>
            <button type="button" id="btn-retry-lose" class="btn btn--primary">Reintentar nivel</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
